
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #172238;
            border-radius: 14px;
        }

        h1 {
            text-align: center;
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #475569;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        a {
            color: #60a5fa;
        }

        .errorlist {
            color: #fca5a5;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>TrustVault</h1>
        <p>Welcome back! Login to your account.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</body>
</html>
