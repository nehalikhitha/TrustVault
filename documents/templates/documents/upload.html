
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Upload Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: #172238;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
        }

        p {
            color: #cbd5e1;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #475569;
            background: white;
            color: #111827;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #38bdf8;
        }

        .errors {
            color: #fca5a5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 TrustVault</h1>
    <p>Upload Your Secure Document</p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            <div class="errors">{{ field.errors }}</div>
        {% endfor %}

        <button type="submit">Upload Document</button>

    </form>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</div>

</body>
</html>
